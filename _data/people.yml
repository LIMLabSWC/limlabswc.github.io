principal_investigator:

  - name: "Dr. Athena Akrami"
    title: "Principal Investigator"
    affiliation: "Sainsbury Wellcome Centre, UCL"
    photo: "athena1b.jpg"
    email: "a.akrami@ucl.ac.uk"
    description: >-
      Athena Akrami leads the Learning, Inference & Memory Lab at the Sainsbury
      Wellcome Centre, UCL. Her research focuses on understanding the neural
      mechanisms underlying learning, memory, and inference in both humans and
      animals.

senior_research_fellows:

  - name: "Vezha Boboeva"
    title: "Senior Research Fellow"
    photo: null
    description: >-
      Vezha works on computational models of working memory and the central
      tendency bias. Her research focuses on understanding how attractor
      networks can explain memory distortions and biases in decision-making
      tasks.

research_fellows:

  - name: "Arpit Agarwal"
    title: "Research Fellow"
    photo: "arpit_agarwal_large.jpg"
    description: >-
      Arpit's research focuses on statistical learning and memory formation in
      rodents. He develops behavioral paradigms to study how animals learn and
      adapt to changing environmental statistics.

  - name: "Edmund Chong"
    title: "Research Fellow"
    photo: "edmund_low_res.png"
    description: >-
      Edmund studies the neural mechanisms of working memory and decision-making.
      His work combines behavioral experiments with computational modeling to
      understand how the brain maintains and manipulates information.

  - name: "Dammy Onih"
    title: "Research Fellow"
    photo: "dammy.jpg"
    description: >-
      Dammy investigates the neural basis of learning and memory using advanced
      imaging techniques. Her research focuses on understanding how neural
      circuits adapt and change during learning processes.


